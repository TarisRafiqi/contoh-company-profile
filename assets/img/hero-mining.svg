<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="[ISI: Foto armada dump truck dan area operasional tambang batu bara]">
  <defs>
    <!-- Dark quarry sky & coal seam gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e12"/>
      <stop offset="45%" stop-color="#181f27"/>
      <stop offset="100%" stop-color="#252f3b"/>
    </linearGradient>

    <!-- Rock bench texture gradients -->
    <linearGradient id="rockFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#252f3b"/>
      <stop offset="100%" stop-color="#141a21"/>
    </linearGradient>

    <!-- Industrial Yellow Haul Truck Gradients -->
    <linearGradient id="truckYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="65%" stop-color="#e5b800"/>
      <stop offset="100%" stop-color="#b38600"/>
    </linearGradient>

    <linearGradient id="truckShadowYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99700"/>
      <stop offset="100%" stop-color="#7a5900"/>
    </linearGradient>

    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b333c"/>
      <stop offset="50%" stop-color="#161b20"/>
      <stop offset="100%" stop-color="#0b0e12"/>
    </linearGradient>

    <!-- Dust cloud radial gradient -->
    <radialGradient id="dustCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1f2937" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f1419" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Open-Pit Coal Mine Terraces / Rock Wall (Right Side) -->
  <polygon points="450,0 1600,0 1600,620 350,620" fill="url(#rockFace)" opacity="0.85"/>
  <polygon points="520,120 1600,60 1600,320 480,350" fill="#1f2731" opacity="0.9"/>
  <polygon points="420,340 1600,290 1600,560 360,560" fill="#2c3643" opacity="0.75"/>

  <!-- Rock fracture lines -->
  <g stroke="#141920" stroke-width="3" opacity="0.65" fill="none">
    <polyline points="600,40 640,180 610,320 660,480"/>
    <polyline points="880,20 920,190 890,340 940,510"/>
    <polyline points="1180,0 1150,160 1210,310 1190,490"/>
    <polyline points="1420,30 1450,210 1400,380 1440,520"/>
    <line x1="480" y1="190" x2="1600" y2="150"/>
    <line x1="430" y1="350" x2="1600" y2="305"/>
  </g>

  <!-- Coal Dust Plume Behind Dump Bed -->
  <ellipse cx="760" cy="290" rx="280" ry="180" fill="url(#dustCloud)"/>

  <!-- Background Secondary Haul Truck (Far Right) -->
  <g transform="translate(1210, 500) scale(0.58)" opacity="0.85">
    <polygon points="20,140 360,90 420,140 390,290 40,290" fill="url(#truckShadowYellow)"/>
    <polygon points="0,95 390,40 430,85 20,140" fill="url(#truckYellow)"/>
    <rect x="210" y="135" width="160" height="140" fill="url(#truckYellow)"/>
    <rect x="255" y="155" width="95" height="90" fill="#18222d" stroke="#374151" stroke-width="4"/>
    <circle cx="120" cy="310" r="85" fill="url(#tireGrad)" stroke="#374151" stroke-width="4"/>
    <circle cx="120" cy="310" r="38" fill="#1f2937"/>
    <circle cx="320" cy="310" r="85" fill="url(#tireGrad)" stroke="#374151" stroke-width="4"/>
    <circle cx="320" cy="310" r="38" fill="#1f2937"/>
  </g>

  <!-- Coal Pile inside Main Haul Truck -->
  <polygon points="590,260 680,185 810,195 920,250 960,315 560,350" fill="#181e24" stroke="#2d3748" stroke-width="2"/>

  <!-- Main Heavy Mining Dump Truck (Foreground Right-Center) -->
  <g transform="translate(490, 230)">
    <!-- Dump Body (Side & Ribbed Reinforcement) -->
    <polygon points="40,180 390,95 390,340 65,375" fill="url(#truckShadowYellow)"/>
    <!-- Dump Body Ribs -->
    <g fill="#5c4300" opacity="0.55">
      <polygon points="85,185 110,178 115,345 90,348"/>
      <polygon points="150,168 178,160 182,338 155,341"/>
      <polygon points="220,150 250,142 254,330 225,333"/>
      <polygon points="295,130 328,122 332,322 300,325"/>
    </g>

    <!-- Dump Canopy / Spill Guard Roof Over Cab -->
    <polygon points="350,25 460,5 795,120 770,155 430,65 370,105" fill="url(#truckYellow)"/>
    <polygon points="370,105 430,65 770,155 710,195" fill="#9c7300"/>

    <!-- Upper Deck & Operator Cab -->
    <polygon points="385,125 695,180 695,280 385,260" fill="#b88700"/>
    <!-- Cab Windows -->
    <polygon points="565,165 655,182 650,235 560,225" fill="#111922" stroke="#FFD600" stroke-width="4"/>
    <polygon points="495,155 550,163 548,220 495,215" fill="#16202b" stroke="#d9a300" stroke-width="3"/>

    <!-- Front Engine Hood & Radiator Grille -->
    <polygon points="395,245 775,270 790,465 395,450" fill="url(#truckYellow)"/>
    <polygon points="320,255 395,245 395,450 320,435" fill="url(#truckShadowYellow)"/>

    <!-- Blue/Dark Industrial Radiator Mesh Grille -->
    <polygon points="625,290 755,302 758,365 625,355" fill="#174482" stroke="#0f1419" stroke-width="4"/>
    <polygon points="625,375 758,385 762,445 625,435" fill="#174482" stroke="#0f1419" stroke-width="4"/>
    <!-- Grille horizontal slats -->
    <g stroke="#9ca3af" stroke-width="2" opacity="0.6">
      <line x1="630" y1="310" x2="752" y2="320"/>
      <line x1="630" y1="330" x2="754" y2="340"/>
      <line x1="630" y1="395" x2="756" y2="405"/>
      <line x1="630" y1="415" x2="758" y2="425"/>
    </g>

    <!-- Safety Handrails & Ladder (Industrial Detail) -->
    <g stroke="#18222d" stroke-width="4" fill="none">
      <polyline points="375,220 375,140 560,155 560,245"/>
      <line x1="375" y1="180" x2="560" y2="198"/>
      <!-- Access Ladder -->
      <line x1="565" y1="255" x2="595" y2="465"/>
      <line x1="590" y1="258" x2="620" y2="465"/>
      <line x1="570" y1="290" x2="595" y2="290"/>
      <line x1="575" y1="330" x2="600" y2="330"/>
      <line x1="580" y1="370" x2="605" y2="370"/>
      <line x1="585" y1="410" x2="610" y2="410"/>
    </g>

    <!-- Headlights -->
    <circle cx="535" cy="285" r="12" fill="#fef08a" stroke="#1f2937" stroke-width="4"/>
    <circle cx="565" cy="288" r="12" fill="#fef08a" stroke="#1f2937" stroke-width="4"/>

    <!-- Undercarriage Shadow -->
    <polygon points="60,375 780,455 750,530 90,480" fill="#090c10"/>

    <!-- Rear Dual Giant Tires -->
    <g transform="translate(155, 430)">
      <ellipse cx="0" cy="0" rx="95" ry="105" fill="url(#tireGrad)" stroke="#374151" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="58" ry="65" fill="#1e252d" stroke="#11151a" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="#374151"/>
    </g>

    <!-- Front Giant Tire (Center Foreground) -->
    <g transform="translate(425, 455)">
      <ellipse cx="0" cy="0" rx="125" ry="135" fill="url(#tireGrad)" stroke="#4b5563" stroke-width="6"/>
      <!-- Tire Tread Notches -->
      <circle cx="0" cy="0" r="108" fill="none" stroke="#1f2937" stroke-width="12" stroke-dasharray="18 14"/>
      <ellipse cx="0" cy="0" rx="72" ry="78" fill="#1e252d" stroke="#0f1419" stroke-width="8"/>
      <ellipse cx="0" cy="0" rx="38" ry="42" fill="#374151" stroke="#FFD600" stroke-width="2"/>
    </g>

    <!-- Far Right Front Tire -->
    <g transform="translate(690, 480)">
      <ellipse cx="0" cy="0" rx="95" ry="105" fill="url(#tireGrad)" stroke="#374151" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="48" ry="54" fill="#181f27"/>
    </g>
  </g>

  <!-- Foreground Coal & Overburden Rocks (Bottom) -->
  <polygon points="0,710 280,680 560,640 840,730 1220,760 1600,740 1600,900 0,900" fill="#12171d"/>
  <polygon points="180,750 480,650 790,740 1150,820 1600,810 1600,900 0,900" fill="#1b222b" opacity="0.8"/>
</svg>

